services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marcapagina
      POSTGRES_PASSWORD: marcapagina
      POSTGRES_DB: marcapagina
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marcapagina']
      interval: 2s
      timeout: 3s
      retries: 20
